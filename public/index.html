<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141416">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>Rip City Over/Under</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23141416'/%3E%3Crect x='6' y='9' width='20' height='4' rx='2' fill='%23F2F0EC'/%3E%3Crect x='6' y='15' width='20' height='4' rx='2' fill='%23D3202F'/%3E%3Crect x='6' y='21' width='20' height='4' rx='2' fill='%23F2F0EC'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column, like a betting slip on a phone. A scoreboard band on top, then cards of lines. */
:root{
  --bg:#EEEDEA; --panel:#FFFFFF; --ink:#141416; --muted:#68666C; --line:#D9D6D0;
  --accent:#D3202F; --accent-ink:#FFFFFF; --band:#141416; --band-ink:#F4F2EE;
  --good:#1D8048; --good-bg:#E3F1E8; --bad:#8E8A90; --bad-bg:#ECEAE7; --push:#6A5A2A;
  --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --body:"Instrument Sans",-apple-system,"Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101012; --panel:#1A1A1E; --ink:#F2F0EC; --muted:#9C99A0; --line:#2E2D33;
  --accent:#FF4655; --accent-ink:#16080A; --band:#000000; --band-ink:#F2F0EC;
  --good:#5BD28A; --good-bg:#16301F; --bad:#8C8990; --bad-bg:#232227; --push:#D8C27A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101012; --panel:#1A1A1E; --ink:#F2F0EC; --muted:#9C99A0; --line:#2E2D33;
  --accent:#FF4655; --accent-ink:#16080A; --band:#000000; --band-ink:#F2F0EC;
  --good:#5BD28A; --good-bg:#16301F; --bad:#8C8990; --bad-bg:#232227; --push:#D8C27A; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 56px;display:flex;flex-direction:column;gap:18px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
a{color:inherit}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.kicker{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
h1,h2{font-family:var(--display);font-weight:800;text-transform:uppercase;line-height:.95;margin:0;text-wrap:balance}
h1{font-size:56px;letter-spacing:.5px}
h2{font-size:28px;letter-spacing:.4px}
.muted{color:var(--muted)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 14px;font-weight:600;font-size:14px;text-decoration:none}
.stripes{display:flex;gap:5px;height:6px}
.stripes i{flex:1;border-radius:3px;background:var(--ink)}
.stripes i:nth-child(2){background:var(--accent)}
/* Scoreboard band */
.board{background:var(--band);color:var(--band-ink);border-radius:18px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.board .kicker{color:color-mix(in srgb,var(--band-ink) 62%,transparent)}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px}
.team{display:flex;flex-direction:column;gap:2px;min-width:0}
.team.r{text-align:right;align-items:flex-end}
.abbr{font-family:var(--display);font-weight:900;font-size:64px;line-height:.85;letter-spacing:1px}
.team.por .abbr{color:var(--accent)}
.tname{font-size:13px;color:color-mix(in srgb,var(--band-ink) 70%,transparent)}
.at{font-family:var(--display);font-weight:700;font-size:22px;color:color-mix(in srgb,var(--band-ink) 50%,transparent)}
.score{font-family:var(--mono);font-weight:700;font-size:28px}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;text-decoration:none;padding:0 18px}
.cta.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.board .cta.ghost{color:var(--band-ink);border-color:color-mix(in srgb,var(--band-ink) 40%,transparent)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 160px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px}
.list{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:13px 16px;text-decoration:none;border-top:1px solid var(--line);min-height:56px}
.li:first-child{border-top:0}
.li .date{width:62px;flex:none;font-size:13px;line-height:1.2}
.li .date b{display:block;font-family:var(--display);font-size:20px;font-weight:800;text-transform:uppercase}
.li .opp{flex:1;min-width:0;font-weight:600}
.li .opp small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.chip{font-size:11.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;padding:4px 8px;border-radius:6px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.done{background:var(--good-bg);border-color:transparent;color:var(--good)}
.chip.open{border-color:var(--ink);color:var(--ink)}
/* Pick cards */
.q{display:flex;flex-direction:column;gap:12px}
.qhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.who{min-width:0}
.who b{display:block;font-size:17px}
.who small{color:var(--muted);font-size:13px}
.lineval{text-align:right;flex:none}
.lineval .num{font-size:30px;font-weight:700;line-height:1}
.lineval small{display:block;font-size:11.5px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{min-height:50px;border-radius:12px;border:1.5px solid var(--line);background:transparent;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.seg button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg button:disabled{cursor:default}
.seg button:disabled:not([aria-pressed="true"]){opacity:.45}
.seg.win button{min-height:64px;flex-direction:column;gap:0;line-height:1.1}
.seg.win button .abbr2{font-family:var(--display);font-weight:900;font-size:30px}
.seg.win button small{font-weight:500;font-size:12px;color:inherit;opacity:.8}
.tri{font-size:11px}
.progress{display:flex;align-items:center;gap:10px;font-size:14px}
.bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.others{display:flex;flex-wrap:wrap;gap:6px}
.pickchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:5px 9px;border-radius:8px;background:var(--bad-bg)}
.pickchip.good{background:var(--good-bg);color:var(--good)}
.pickchip.badp{color:var(--bad);text-decoration:line-through}
.pickchip.push{color:var(--push)}
.final{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;border-top:1px dashed var(--line);padding-top:10px}
.pts{font-family:var(--mono);font-weight:700}
.pts.p{color:var(--good)} .pts.m{color:var(--bad)} .pts.z{color:var(--push)}
/* Leaderboard */
.lb{display:flex;flex-direction:column;gap:8px}
.lbrow{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:12px;padding:14px 16px;background:var(--panel);border:1px solid var(--line);border-radius:14px}
.lbrow.first{border-color:var(--ink)}
.rank{font-family:var(--display);font-weight:900;font-size:30px;line-height:1}
.lbrow .nm{font-weight:700;font-size:17px;min-width:0;overflow-wrap:anywhere}
.lbrow .nm small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.total{font-family:var(--mono);font-weight:700;font-size:30px}
.you{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--accent);margin-left:6px}
details.gm{background:var(--panel);border:1px solid var(--line);border-radius:14px}
details.gm summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:12px}
details.gm summary::-webkit-details-marker{display:none}
details.gm summary .opp{flex:1;min-width:0;font-weight:600}
details.gm summary .opp small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.tbl{overflow-x:auto;border-top:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:top}
thead th{border-top:0;font-size:11.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted);font-weight:700}
td.c,th.c{text-align:center}
.mk{font-weight:700;white-space:nowrap}
.mk.p{color:var(--good)} .mk.m{color:var(--bad)} .mk.z{color:var(--push)}
/* Forms */
.form{display:flex;flex-direction:column;gap:10px}
.frow{display:grid;grid-template-columns:72px 1fr 82px 74px 36px;gap:6px;align-items:center}
.frow.g{grid-template-columns:1fr 90px}
input,select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;min-width:0;width:100%;box-sizing:border-box}
.x{border:1px solid var(--line);background:transparent;border-radius:10px;height:40px}
.note{font-size:14px;color:var(--muted)}
.banner{padding:12px 14px;border-radius:12px;background:var(--bad-bg);font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:420px){h1{font-size:46px}.abbr{font-size:54px}.frow{grid-template-columns:64px 1fr 72px 64px 34px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<style>
body{margin:0}
.wrap{padding-top:calc(20px + env(safe-area-inset-top,0px))}
.login{display:flex;flex-direction:column;gap:12px}
.login label{font-weight:600;font-size:14px}
.login input{font-size:17px;padding:13px 14px}
.err{color:var(--accent);font-weight:600;font-size:14px;min-height:20px}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;color:var(--muted);font-size:14px}

html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
/* View toggle */
.vt{display:inline-grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:3px;align-self:flex-start}
.vt button{border:0;background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;color:var(--muted)}
.vt button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* Swipe deck */
.deckhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mini{display:flex;flex-direction:column;gap:2px;font-family:var(--display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1}
.mini .tip{font-family:var(--body);font-weight:500;font-size:13px;text-transform:none;color:var(--muted)}
.deck{position:relative;height:clamp(340px,54vh,500px);height:clamp(340px,54dvh,500px)}
.swipe{position:absolute;inset:0;background:var(--panel);border:1px solid var(--line);border-radius:26px;box-shadow:0 18px 40px -18px rgba(0,0,0,.35);display:flex;flex-direction:column;justify-content:space-between;padding:22px;box-sizing:border-box;touch-action:pan-y;user-select:none;-webkit-user-select:none;overflow:hidden}
.swipe.top{cursor:grab;z-index:2}
.swipe.top:active{cursor:grabbing}
.swipe.under-card{transform:scale(.94) translateY(14px);opacity:.7;z-index:1;transition:transform .3s cubic-bezier(.2,.7,.3,1),opacity .3s}
.swipe.under-card.rise{transform:none;opacity:1}
.swipe .tag{font-size:12px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted)}
.swipe .pl{font-family:var(--display);font-weight:900;font-size:clamp(40px,11vw,56px);line-height:.9;text-transform:uppercase;letter-spacing:.5px;margin-top:6px;overflow-wrap:anywhere}
.swipe .big{display:flex;align-items:baseline;gap:10px}
.swipe .big .num{font-size:clamp(84px,26vw,120px);font-weight:700;line-height:.85}
.swipe .big small{font-weight:700;font-size:20px;letter-spacing:1px;color:var(--muted)}
.swipe .hint{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted)}
.swipe .was{font-size:13px;font-weight:600;color:var(--accent)}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:6px}
.vs .side{display:flex;flex-direction:column;gap:4px;min-width:0}
.vs .side.r{text-align:right;align-items:flex-end}
.vs .ab{font-family:var(--display);font-weight:900;font-size:clamp(64px,19vw,92px);line-height:.85}
.vs .side.por .ab{color:var(--accent)}
.vs .nm{font-size:13px;color:var(--muted)}
.vs .or{font-family:var(--display);font-weight:700;font-size:20px;color:var(--muted);padding-bottom:18px}
.stamp{position:absolute;top:26px;font-family:var(--display);font-weight:900;font-size:40px;letter-spacing:1px;text-transform:uppercase;padding:2px 12px;border:4px solid currentColor;border-radius:10px;opacity:0;pointer-events:none}
.stamp.yes{left:22px;color:var(--accent);transform:rotate(-14deg)}
.stamp.no{right:22px;color:var(--ink);transform:rotate(14deg)}
.swipe.enter-l{animation:enterL .32s cubic-bezier(.2,.7,.3,1)}
@keyframes enterL{from{transform:translateX(-110%) rotate(-12deg)}to{transform:none}}
.deckbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.deckbtns button{min-height:62px;border-radius:16px;font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--ink);background:transparent}
.deckbtns button.yes{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.decknav{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px}
.decknav button{border:0;background:none;padding:8px 0;font-weight:600;color:var(--muted)}
.decknav button:disabled{opacity:.35}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;flex:1}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.dots i.cur{background:var(--accent);transform:scale(1.3)}
.recap{display:flex;flex-direction:column}
.recap div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.recap div:first-child{border-top:0}
.recap b{white-space:nowrap}
@media (prefers-reduced-motion:reduce){.swipe.enter-l{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="topbar"><div class="stripes" style="width:84px"><i></i><i></i><i></i></div></div>
  <h1>Rip City<br>Over/Under</h1>
  <p class="muted">Loading…</p>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const TZ = "America/Los_Angeles";
const STATS = {PTS:"points",REB:"rebounds",AST:"assists","3PM":"threes",BLK:"blocks",STL:"steals"};
const S = {token:null, me:null, games:[], players:[], picks:{}, pickedBy:{}, loaded:false, offline:false, setup:null, loginErr:""};
const app = document.getElementById("app");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ptDay = d => new Date(d).toLocaleDateString("en-CA",{timeZone:TZ});
const fmtDay = d => new Date(d).toLocaleDateString("en-US",{timeZone:TZ,weekday:"short",month:"short",day:"numeric"});
const fmtTime = d => new Date(d).toLocaleTimeString("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"}) + " PT";
const dow = d => new Date(d).toLocaleDateString("en-US",{timeZone:TZ,weekday:"short"});
const md = d => new Date(d).toLocaleDateString("en-US",{timeZone:TZ,month:"short",day:"numeric"});
const locked = g => Date.now() >= Date.parse(g.tip);
const isToday = g => ptDay(g.tip) === ptDay(Date.now());
const fmtLine = n => Number.isInteger(n) ? String(n) : n.toFixed(1);
const signed = n => n > 0 ? "+" + n : n < 0 ? "−" + Math.abs(n) : "0";
const cls = n => n > 0 ? "p" : n < 0 ? "m" : "z";
const nameOf = id => S.players.find(p => p.id === id)?.name || "Player";
const uid = () => S.me?.id;

const store = {
  get(){ try { return localStorage.getItem("ripcity.token"); } catch { return null; } },
  set(v){ try { v ? localStorage.setItem("ripcity.token", v) : localStorage.removeItem("ripcity.token"); } catch {} },
};

function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2000); }

async function api(path, opts = {}){
  const r = await fetch(path, {...opts, headers: {"content-type": "application/json", ...(S.token ? {authorization: "Bearer " + S.token} : {})}});
  let body = {}; try { body = await r.json(); } catch {}
  if (r.status === 401) { signOut(); throw new Error(body.error || "Sign in to play."); }
  if (!r.ok) throw new Error(body.error || "Something went wrong. Try again.");
  return body;
}

/* ---------- scoring ---------- */
function markQ(pick, q, fin){
  if (!pick || !fin || typeof fin.values?.[q.id] !== "number") return null;
  const v = fin.values[q.id];
  if (v === q.line) return 0;
  return (v > q.line) === (pick === "over") ? 1 : -1;
}
function markW(pick, fin){ if (!pick || !fin?.winner) return null; return pick === fin.winner ? 1 : -1; }
function scoreGame(pid, gid){
  const g = gameById(gid), fin = g?.final, mine = S.picks[pid]?.[gid];
  if (!fin || !mine) return null;
  let pts = 0, w = 0, l = 0, p = 0;
  const add = m => { if (m === null) return; pts += m; m > 0 ? w++ : m < 0 ? l++ : p++; };
  add(markW(mine.winner, fin));
  (g.questions || []).forEach(q => add(markQ(mine.q?.[q.id], q, fin)));
  return {pts, w, l, p};
}
function standings(){
  return S.players.map(pl => {
    let pts = 0, w = 0, l = 0, p = 0, games = 0;
    S.games.forEach(g => { const s = scoreGame(pl.id, g.id); if (s && (s.w + s.l + s.p)) { pts += s.pts; w += s.w; l += s.l; p += s.p; games++; } });
    return {uid: pl.id, pts, w, l, p, games};
  }).sort((a, b) => b.pts - a.pts || b.w - a.w);
}

/* ---------- data ---------- */
const gameById = id => S.games.find(g => g.id === id);
function featured(){ const now = Date.now(); return S.games.find(g => Date.parse(g.tip) + 3.5 * 3600e3 > now) || null; }
function status(g){
  if (g.final) return ["done", "Final"];
  if (locked(g)) return ["", g.questions?.length ? "Picks locked" : "No lines"];
  if (!g.questions?.length) return ["", "Lines soon"];
  const mine = S.picks[uid()]?.[g.id];
  const n = (mine?.winner ? 1 : 0) + Object.keys(mine?.q || {}).length;
  if (n >= g.questions.length + 1) return ["done", "Picked"];
  return [isToday(g) ? "hot" : "open", isToday(g) ? "Tonight" : "Picks open"];
}

async function load(){
  try {
    const s = await api("/api/state");
    S.me = s.me; S.games = s.games; S.players = s.players; S.pickedBy = s.pickedBy || {};
    // Keep picks typed since the last save until the server has them.
    const mine = S.picks[uid()];
    S.picks = s.picks || {};
    if (pending.size && mine) { S.picks[uid()] = S.picks[uid()] || {}; pending.forEach(gid => S.picks[uid()][gid] = mine[gid]); }
    S.loaded = true; S.offline = false;
  } catch (e) { if (S.token) { S.offline = true; } }
  refresh();
}

const pending = new Set(); let writing = false;
async function savePicks(){
  if (writing || !pending.size) return;
  writing = true;
  const gid = [...pending][0]; pending.delete(gid);
  const body = S.picks[uid()]?.[gid] || {};
  try { await api("/api/picks/" + gid, {method: "PUT", body: JSON.stringify(body)}); }
  catch (e) { toast(e.message); load(); }
  writing = false;
  if (pending.size) savePicks();
}
// Tapping a pick again clears it in the list view; a swipe always sets it.
function setPick(gid, kind, qid, val, toggle = true){
  const g = gameById(gid); if (!g || locked(g) || !uid()) return;
  const all = S.picks[uid()] = S.picks[uid()] || {};
  const gp = all[gid] = structuredClone(all[gid] || {q:{}});
  gp.q = gp.q || {};
  if (kind === "winner") gp.winner = toggle && gp.winner === val ? null : val;
  else gp.q[qid] = toggle && gp.q[qid] === val ? null : val;
  Object.keys(gp.q).forEach(k => gp.q[k] || delete gp.q[k]);
  pending.add(gid);
  render();
  clearTimeout(setPick.t); setPick.t = setTimeout(savePicks, 400);
}

const VIEW_KEY = "ripcity.view";
S.view = (() => { try { const v = localStorage.getItem(VIEW_KEY); if (v === "cards" || v === "list") return v; } catch {} return matchMedia("(max-width: 640px)").matches ? "cards" : "list"; })();

function deckItems(g){ return [{kind: "winner", id: "winner"}].concat((g.questions || []).map(q => ({kind: "q", id: q.id, q}))); }

function cardsView(g){
  const items = deckItems(g);
  if (!S.deck || S.deck.gid !== g.id) {
    const first = items.findIndex(it => !itemPick(g, it));
    S.deck = {gid: g.id, i: first < 0 ? items.length : first, enter: false};
  }
  const i = Math.min(S.deck.i, items.length);
  const done = items.filter(it => itemPick(g, it)).length;
  const others = S.pickedBy[g.id] || [];
  const head = `<div class="deckhead"><div class="mini"><span>${g.home ? `${esc(g.opp)} <span class="muted">at</span> POR` : `POR <span class="muted">at</span> ${esc(g.opp)}`}</span><span class="tip">${isToday(g) ? "Tonight" : esc(fmtDay(g.tip))} · ${esc(fmtTime(g.tip))}</span></div>${viewToggle()}</div>`;
  const dots = `<div class="dots" aria-hidden="true">${items.map((it, k) => `<i class="${k === i ? "cur" : itemPick(g, it) ? "on" : ""}"></i>`).join("")}</div>`;

  if (i >= items.length) {
    const rows = items.map(it => {
      const pk = itemPick(g, it);
      const label = it.kind === "winner" ? "Who wins?" : `${esc(it.q.player)} <span class="muted">${esc(it.q.stat)} ${fmtLine(it.q.line)}</span>`;
      return `<div><span>${label}</span><b>${pk ? esc(pk === "over" ? "Over" : pk === "under" ? "Under" : pk) : "—"}</b></div>`;
    }).join("");
    return shell(`${head}${banner()}
      <div class="card" style="display:flex;flex-direction:column;gap:14px">
        <div><span class="kicker">${done === items.length ? "All picked" : `${done} of ${items.length} picked`}</span><h2 style="margin-top:6px">${done === items.length ? "You're locked in." : "Almost there."}</h2></div>
        <p class="note" style="margin:0">You can change picks until tip-off. ${others.length ? `${esc(others.map(nameOf).join(", "))} ${others.length > 1 ? "have" : "has"} picked too.` : ""}</p>
        <div class="recap">${rows}</div>
      </div>
      <div class="deckbtns"><button type="button" data-deck="restart">Go through again</button><a class="cta" href="#">Done</a></div>`, {href:"", label:"Home"});
  }
  const it = items[i], next = items[i + 1];
  const yes = it.kind === "winner" ? "Blazers" : "Over", no = it.kind === "winner" ? esc(g.opp) : "Under";
  const enter = S.deck.enter; S.deck.enter = false;
  return shell(`${head}${banner()}
    <div class="deck" id="deck">${next ? cardHTML(g, next, false) : ""}${cardHTML(g, it, true, enter)}</div>
    <div class="deckbtns"><button type="button" data-fly="-1"><span aria-hidden="true">←</span> ${no}</button><button type="button" class="yes" data-fly="1">${yes} <span aria-hidden="true">→</span></button></div>
    <div class="decknav"><button type="button" data-deck="back" ${i === 0 ? "disabled" : ""}>← Previous</button>${dots}<button type="button" data-deck="skip">Skip →</button></div>`, {href:"", label:"Home"});
}

function deckCommit(dir){
  const g = gameById(S.deck?.gid); if (!g) return;
  const it = deckItems(g)[S.deck.i]; if (!it) return;
  const val = it.kind === "winner" ? (dir > 0 ? "POR" : g.opp) : (dir > 0 ? "over" : "under");
  S.deck.i++;
  deck.busy = false;
  setPick(g.id, it.kind, it.id, val, false); // re-renders
}

// Throw the top card off one side, then record the pick.
function fly(dir){
  const el = app.querySelector(".swipe.top");
  if (!el || deck.busy) return;
  if (locked(gameById(S.deck.gid))) { render(); return; }
  deck.busy = true;
  if (navigator.vibrate) try { navigator.vibrate(8); } catch {}
  if (reduceMotion()) return deckCommit(dir);
  el.querySelector(dir > 0 ? ".stamp.yes" : ".stamp.no").style.opacity = 1;
  el.style.transition = "transform .32s cubic-bezier(.3,.5,.4,1)";
  const w = Math.max(innerWidth, 500);
  el.style.transform = `translateX(${dir * w * 1.15}px) translateY(-20px) rotate(${dir * 22}deg)`;
  app.querySelector(".swipe.under-card")?.classList.add("rise");
  setTimeout(() => deckCommit(dir), 300);
}

function bindDeck(){
  const el = app.querySelector(".swipe.top");
  if (!el) return;
  const yes = el.querySelector(".stamp.yes"), no = el.querySelector(".stamp.no"), under = app.querySelector(".swipe.under-card");
  let sx = 0, sy = 0, dx = 0, axis = null, down = false, t0 = 0;
  const reset = () => {
    el.style.transition = "transform .28s cubic-bezier(.2,.8,.3,1.2)"; el.style.transform = "";
    yes.style.opacity = 0; no.style.opacity = 0;
    if (under) { under.style.transition = ""; under.style.transform = ""; under.style.opacity = ""; }
  };
  el.addEventListener("pointerdown", e => {
    if (deck.busy || (e.pointerType === "mouse" && e.button !== 0)) return;
    down = true; axis = null; dx = 0; sx = e.clientX; sy = e.clientY; t0 = performance.now();
    el.style.transition = "none";
    deck.busy = true; // no background re-render mid-drag
  });
  el.addEventListener("pointermove", e => {
    if (!down) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (!axis && (Math.abs(mx) > 8 || Math.abs(my) > 8)) {
      axis = Math.abs(mx) > Math.abs(my) ? "x" : "y";
      if (axis === "x") el.setPointerCapture?.(e.pointerId);
    }
    if (axis !== "x") return;
    dx = mx;
    el.style.transform = `translateX(${dx}px) translateY(${Math.abs(dx) * -0.04}px) rotate(${dx / 16}deg)`;
    const k = Math.min(1, Math.abs(dx) / 90);
    yes.style.opacity = dx > 0 ? k : 0; no.style.opacity = dx < 0 ? k : 0;
    if (under) { under.style.transition = "none"; const s = 0.94 + 0.06 * k; under.style.transform = `scale(${s}) translateY(${14 * (1 - k)}px)`; under.style.opacity = 0.7 + 0.3 * k; }
  });
  const end = () => {
    if (!down) return;
    down = false;
    const v = Math.abs(dx) / Math.max(1, performance.now() - t0); // px per ms
    if (axis === "x" && (Math.abs(dx) > 90 || (Math.abs(dx) > 40 && v > 0.5))) { deck.busy = false; fly(dx > 0 ? 1 : -1); }
    else { deck.busy = false; reset(); }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", () => { if (down) { down = false; deck.busy = false; reset(); } });
}

addEventListener("keydown", e => {
  if (!app.querySelector(".swipe.top") || e.target.closest?.("input,select,textarea")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); fly(1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); fly(-1); }
});

/* ---------- router ---------- */
const route = () => location.hash.replace(/^#/, "");
function render(){
  const r = route();
  let html;
  if (!S.token) html = loginView();
  else if (!S.loaded) html = `<div class="topbar">${stripes(84)}</div><h1>Rip City<br>Over/Under</h1><p class="muted">${S.offline ? "Can't reach the server. Check your connection." : "Loading…"}</p>`;
  else if (r.startsWith("game-")) html = gameView(r.slice(5));
  else if (r.startsWith("setup-")) html = setupView(r.slice(6));
  else if (r.startsWith("grade-")) html = gradeView(r.slice(6));
  else if (r === "results") html = resultsView();
  else if (r === "schedule") html = scheduleView();
  else html = homeView();
  const keepScroll = render.last === r;
  app.innerHTML = html;
  if (!keepScroll) window.scrollTo(0, 0);
  render.last = r;
  bindDeck();
}
// Background refreshes leave half-filled forms alone.
function refresh(){ if (deck.busy) return; if (app.querySelector("form") && (!S.token || /^(setup|grade)-/.test(route()))) return; render(); }
addEventListener("hashchange", render);

function signOut(){ S.token = null; S.me = null; S.loaded = false; store.set(null); render(); }

app.addEventListener("click", async e => {
  const id = route().slice(5);
  const w = e.target.closest("[data-win]"); if (w) return setPick(id, "winner", null, w.dataset.win);
  const q = e.target.closest("[data-q]"); if (q) return setPick(id, "q", q.dataset.q, q.dataset.v);
  if (e.target.closest("#signOut")) return signOut();
  const vt = e.target.closest("[data-view]");
  if (vt) { S.view = vt.dataset.view; try { localStorage.setItem(VIEW_KEY, S.view); } catch {} S.deck = null; render(); return; }
  const fl = e.target.closest("[data-fly]"); if (fl) return fly(+fl.dataset.fly);
  const dk = e.target.closest("[data-deck]");
  if (dk && S.deck && !deck.busy) {
    const n = deckItems(gameById(S.deck.gid)).length;
    if (dk.dataset.deck === "back" && S.deck.i > 0) { S.deck.i--; S.deck.enter = true; }
    if (dk.dataset.deck === "skip") S.deck.i = Math.min(n, S.deck.i + 1);
    if (dk.dataset.deck === "restart") S.deck.i = 0;
    render(); return;
  }
  if (e.target.closest("#syncBtn")) {
    toast("Checking ESPN…");
    try { const r = await api("/api/admin/sync", {method: "POST"}); toast(r.log[r.log.length - 1] || "Up to date"); load(); } catch (err) { toast(err.message); }
    return;
  }
  if (e.target.closest("#addRow")) { readSetup(); const n = S.setup.rows.length; S.setup.rows.push({id: "q" + Date.now().toString(36), team: n < 6 ? "POR" : gameById(S.setup.id).opp, player:"", stat:"PTS", line:""}); render(); return; }
  const del = e.target.closest("[data-del]"); if (del) { readSetup(); S.setup.rows.splice(+del.dataset.del, 1); render(); }
});
function readSetup(){ app.querySelectorAll("#setupForm [data-f]").forEach(el => { const row = S.setup.rows[+el.dataset.i]; if (row) row[el.dataset.f] = el.value; }); }

app.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "loginForm") {
    const name = app.querySelector("#ln").value, passcode = app.querySelector("#lp").value;
    try {
      const r = await api("/api/login", {method: "POST", body: JSON.stringify({name, passcode})});
      S.token = r.token; S.me = r.me; S.loginErr = ""; store.set(r.token); await load();
    } catch (err) { S.loginErr = err.message; app.querySelector("#lerr").textContent = err.message; }
  }
  if (e.target.id === "setupForm") {
    readSetup();
    const gid = S.setup.id;
    try { await api("/api/admin/lines/" + gid, {method: "PUT", body: JSON.stringify({questions: S.setup.rows})}); S.setup = null; toast("Lines saved"); location.hash = "game-" + gid; load(); }
    catch (err) { toast(err.message); }
  }
  if (e.target.id === "gradeForm") {
    const gid = route().slice(6);
    const values = {}; app.querySelectorAll("[data-qv]").forEach(el => { if (el.value.trim() !== "") values[el.dataset.qv] = el.value; });
    const final = {winner: app.querySelector("#gw").value || null, porScore: app.querySelector("#gps").value, oppScore: app.querySelector("#gos").value, values};
    try { await api("/api/admin/final/" + gid, {method: "PUT", body: JSON.stringify({final})}); toast("Graded"); location.hash = "game-" + gid; load(); }
    catch (err) { toast(err.message); }
  }
});

S.token = store.get();
render();
if (S.token) load();
setInterval(() => { if (S.token && !document.hidden) load(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.token) load(); });
</script>
</body>
