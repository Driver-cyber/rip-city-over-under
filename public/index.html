.qedit input{padding:12px}
.chips{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.chips button{min-height:44px;border:1.5px solid var(--line);border-radius:10px;background:transparent;font-weight:700;font-size:14px;color:var(--ink);padding:0}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.qfoot{display:flex;justify-content:space-between;align-items:center}
.qfoot .linkbtn{min-height:36px}
.qfoot .linkbtn:last-child{color:var(--ink);font-weight:700;text-decoration:none}
.addrow{display:flex;flex-wrap:wrap;gap:8px}
.addrow button{flex:1 1 140px;min-height:48px;border:1.5px dashed var(--muted);border-radius:12px;background:transparent;font-weight:700;font-size:15px;color:var(--ink)}
.savebar .cta{width:100%}
.savebar{position:sticky;bottom:0;z-index:5;margin:0 -16px;padding:14px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(to bottom,transparent,var(--bg) 22px)}
@media (max-width:360px){.chips{grid-template-columns:repeat(3,1fr)}.step{grid-template-columns:40px 48px 40px}}
a.trow{text-decoration:none;color:inherit;min-height:64px;box-sizing:border-box}
a.trow:active{background:var(--bg)}
.trow .pill{flex:none;border:1.5px solid var(--ink);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.trow .pill.hot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.trow .opp b{font-weight:600}
.card.q.special{border-color:var(--ink);border-style:dashed}
.swipe.special{border:2px dashed var(--ink)}
.swipe .pl.long{font-family:var(--body);font-weight:700;font-size:clamp(26px,7vw,34px);line-height:1.15;text-transform:none;letter-spacing:0}
.swipe .ynq{font-family:var(--display);font-weight:900;font-size:clamp(56px,16vw,80px);line-height:.9;text-transform:uppercase}

.alert{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-size:15px}
.alert a{color:var(--accent-ink);font-weight:600}
details.card summary{list-style:none}
.sumrow{display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.sumrow .tw::after{content:"Show";font-size:12px;letter-spacing:.6px;color:var(--ink)}
details[open] .sumrow .tw::after{content:"Hide"}
details.card summary::-webkit-details-marker{display:none}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="topbar"><div class="stripes" style="width:84px"><i></i><i></i><i></i></div></div>
  <h1>Rip City<br>Over/Under</h1>
  <p class="muted">Loading…</p>
</div>
<div class="menu" id="menu" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const TZ = "America/Los_Angeles";
const STATS = {PTS:"points",REB:"rebounds",AST:"assists","3PM":"threes",BLK:"blocks",STL:"steals"};
// Question kinds: player stat (graded from ESPN), commissioner's custom over/under, and yes/no.
const qKind = q => q.kind === "custom" || q.kind === "yn" ? q.kind : "stat";
const isYN = q => qKind(q) === "yn";
const qTitle = q => qKind(q) === "stat" ? q.player : q.text;
const qLineText = q => qKind(q) === "stat" ? `${q.stat} ${fmtLine(q.line)}` : isYN(q) ? "Yes or no" : `Over/under ${fmtLine(q.line)}`;
const pickLabel = pk => ({over: "Over", under: "Under", yes: "Yes", no: "No"})[pk] || pk;
const pickShort = pk => ({over: "O", under: "U", yes: "Y", no: "N"})[pk] || pk;
const finalText = (q, v) => isYN(q) ? (v ? "Yes" : "No") : String(v);
// Commissioner's questions on a started game that still need an answer.
const needsAnswers = g => locked(g) ? (g.questions || []).filter(q => qKind(q) !== "stat" && typeof g.final?.values?.[q.id] !== "number") : [];
const isFinal = g => !!g.final?.winner;
const S = {token:null, me:null, games:[], players:[], picks:{}, pickedBy:{}, loaded:false, offline:false, setup:null, loginErr:""};
const app = document.getElementById("app");

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ptDay = d => new Date(d).toLocaleDateString("en-CA",{timeZone:TZ});
const fmtDay = d => new Date(d).toLocaleDateString("en-US",{timeZone:TZ,weekday:"short",month:"short",day:"numeric"});
const fmtTime = d => new Date(d).toLocaleTimeString("en-US",{timeZone:TZ,hour:"numeric",minute:"2-digit"}) + " PT";
const dow = d => new Date(d).toLocaleDateString("en-US",{timeZone:TZ,weekday:"short"});
const md = d => new Date(d).toLocaleDateString("en-US",{timeZone:TZ,month:"short",day:"numeric"});
const locked = g => Date.now() >= Date.parse(g.tip);
const isToday = g => ptDay(g.tip) === ptDay(Date.now());
const fmtLine = n => Number.isInteger(n) ? String(n) : n.toFixed(1);
const signed = n => n > 0 ? "+" + n : n < 0 ? "−" + Math.abs(n) : "0";
const cls = n => n > 0 ? "p" : n < 0 ? "m" : "z";
const nameOf = id => S.players.find(p => p.id === id)?.name || "Player";
const uid = () => S.me?.id;

const store = {
  get(){ try { return localStorage.getItem("ripcity.token"); } catch { return null; } },
  set(v){ try { v ? localStorage.setItem("ripcity.token", v) : localStorage.removeItem("ripcity.token"); } catch {} },
};

function toast(msg){ const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("on"), 2000); }

async function api(path, opts = {}){
  const r = await fetch(path, {...opts, headers: {"content-type": "application/json", ...(S.token ? {authorization: "Bearer " + S.token} : {})}});
  let body = {}; try { body = await r.json(); } catch {}
  if (r.status === 401) { signOut(); throw new Error(body.error || "Sign in to play."); }
  if (!r.ok) throw new Error(body.error || "Something went wrong. Try again.");
  return body;
}

/* ---------- scoring ---------- */
function markQ(pick, q, fin){
  if (!pick || !fin || typeof fin.values?.[q.id] !== "number") return null;
  const v = fin.values[q.id];
  if (isYN(q)) return (v === 1) === (pick === "yes") ? 1 : -1;
  if (v === q.line) return 0;
  return (v > q.line) === (pick === "over") ? 1 : -1;
}
function markW(pick, fin){ if (!pick || !fin?.winner) return null; return pick === fin.winner ? 1 : -1; }
function scoreGame(pid, gid){
  const g = gameById(gid), fin = g?.final, mine = S.picks[pid]?.[gid];
  if (!fin || !mine) return null;
  let pts = 0, w = 0, l = 0, p = 0;
  const add = m => { if (m === null) return; pts += m; m > 0 ? w++ : m < 0 ? l++ : p++; };
  add(markW(mine.winner, fin));
  (g.questions || []).forEach(q => add(markQ(mine.q?.[q.id], q, fin)));
  return {pts, w, l, p};
}
function standings(){
  return S.players.map(pl => {
    let pts = 0, w = 0, l = 0, p = 0, games = 0;
    S.games.forEach(g => { const s = scoreGame(pl.id, g.id); if (s && (s.w + s.l + s.p)) { pts += s.pts; w += s.w; l += s.l; p += s.p; games++; } });
    return {uid: pl.id, pts, w, l, p, games};
  }).sort((a, b) => b.pts - a.pts || b.w - a.w);
}

/* ---------- data ---------- */
const gameById = id => S.games.find(g => g.id === id);
function featured(){ const now = Date.now(); return S.games.find(g => Date.parse(g.tip) + 3.5 * 3600e3 > now) || null; }
function status(g){
  if (isFinal(g)) return ["done", "Final"];
  if (locked(g)) return ["", g.questions?.length ? "Picks locked" : "No lines"];
  if (!g.questions?.length) return ["", "Lines soon"];
  const mine = S.picks[uid()]?.[g.id];
  const n = (mine?.winner ? 1 : 0) + Object.keys(mine?.q || {}).length;
  if (n >= g.questions.length + 1) return ["done", "Picked"];
  return [isToday(g) ? "hot" : "open", isToday(g) ? "Tonight" : "Picks open"];
}

async function load(){
  try {
    const s = await api("/api/state");
    S.me = s.me; S.games = s.games; S.players = s.players; S.pickedBy = s.pickedBy || {};
    // Keep picks typed since the last save until the server has them.
    const mine = S.picks[uid()];
    S.picks = s.picks || {};
    if (pending.size && mine) { S.picks[uid()] = S.picks[uid()] || {}; pending.forEach(gid => S.picks[uid()][gid] = mine[gid]); }
    S.loaded = true; S.offline = false;
  } catch (e) { if (S.token) { S.offline = true; } }
  refresh();
}

const pending = new Set(); let writing = false;
async function savePicks(){
  if (writing || !pending.size) return;
  writing = true;
  const gid = [...pending][0]; pending.delete(gid);
  const body = S.picks[uid()]?.[gid] || {};
  try { await api("/api/picks/" + gid, {method: "PUT", body: JSON.stringify(body)}); }
  catch (e) { toast(e.message); load(); }
  writing = false;
  if (pending.size) savePicks();
}
// Tapping a pick again clears it in the list view; a swipe always sets it.
function setPick(gid, kind, qid, val, toggle = true){
  const g = gameById(gid); if (!g || locked(g) || !uid()) return;
  const all = S.picks[uid()] = S.picks[uid()] || {};
  const gp = all[gid] = structuredClone(all[gid] || {q:{}});
  gp.q = gp.q || {};
  if (kind === "winner") gp.winner = toggle && gp.winner === val ? null : val;
  else gp.q[qid] = toggle && gp.q[qid] === val ? null : val;
  Object.keys(gp.q).forEach(k => gp.q[k] || delete gp.q[k]);
  pending.add(gid);
  render();
  clearTimeout(setPick.t); setPick.t = setTimeout(savePicks, 400);
}

/* ---------- views ---------- */
const stripes = w => `<div class="stripes" style="width:${w}px"><i></i><i></i><i></i></div>`;
function shell(inner, back){
  return `${back ? `<div class="topbar"><a class="back" href="#${back.href}">← ${esc(back.label)}</a><span class="tbr">${stripes(60)}${menuBtn()}</span></div>` : ""}${inner}`;
}
function boardHTML(g, big){
  const fin = g.final;
  const por = `<div class="team por${g.home ? " r" : ""}"><span class="abbr">POR</span><span class="tname">Trail Blazers</span>${fin?.porScore != null ? `<span class="score">${fin.porScore}</span>` : ""}</div>`;
  const opp = `<div class="team${g.home ? "" : " r"}"><span class="abbr">${esc(g.opp)}</span><span class="tname">${esc(g.oppName)}</span>${fin?.oppScore != null ? `<span class="score">${fin.oppScore}</span>` : ""}</div>`;
  return `<div class="board">
    <div class="kicker">${isToday(g) ? "Tonight" : esc(fmtDay(g.tip))} · ${esc(fmtTime(g.tip))}${fin ? " · Final" : ""}</div>
    <div class="match">${g.home ? opp : por}<span class="at">at</span>${g.home ? por : opp}</div>
    ${big || ""}
  </div>`;
}
function banner(){ return S.offline ? `<div class="banner">Can't reach the server right now. What you see may be out of date.</div>` : ""; }

function loginView(){
  return `<div class="topbar">${stripes(84)}</div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <span class="kicker">Blazers · 2026–27 season</span>
    <h1>Rip City<br>Over/Under</h1>
    <p class="muted" style="margin:0">Pick the winner and ten stat lines for each game. Right is +1, wrong is −1, landing exactly on the line is 0.</p>
  </div>
  <form class="card login" id="loginForm">
    <label for="ln">Your name</label>
    <input id="ln" autocomplete="nickname" maxlength="20" required placeholder="First name">
    <label for="lp">Family passcode</label>
    <input id="lp" type="password" autocomplete="current-password" required>
    <div class="err" id="lerr">${esc(S.loginErr)}</div>
    <button class="cta" type="submit">Let's play</button>
    <p class="note" style="margin:0">Use the same name each time so your points add up. This phone will remember you.</p>
  </form>`;
}

function listRow(g){ const [c, label] = status(g); return `<a class="li" href="#game-${g.id}"><div class="date"><b>${esc(dow(g.tip))}</b>${esc(md(g.tip))}</div><div class="opp">${g.home ? "vs" : "at"} ${esc(g.oppName)}<small>${esc(fmtTime(g.tip))}</small></div><span class="chip ${c}">${esc(label)}</span></a>`; }

function homeView(){
  const f = featured(), st = standings();
  let feat = "";
  if (f) {
    const [, label] = status(f);
    const btn = f.questions?.length
      ? `<a class="cta" href="#game-${f.id}">${locked(f) ? "See everyone's picks" : label === "Picked" ? "Review your picks" : "Make your picks"}</a>`
      : `<div class="note" style="color:inherit;opacity:.75">Lines go up automatically the day before the game.</div>${cm() ? `<a class="cta ghost" href="#setup-${f.id}">Post lines now</a>` : ""}`;
    feat = boardHTML(f, btn);
  } else feat = `<div class="card">No games left on the schedule.</div>`;
  const now = Date.now();
  const upcoming = S.games.filter(g => g !== f && Date.parse(g.tip) > now).slice(0, 5);
  const recent = S.games.filter(g => g !== f && Date.parse(g.tip) <= now && g.questions?.length).slice(-4).reverse();
  const lead = st.some(r => r.games)
    ? st.filter(r => r.games).slice(0, 3).map(r => `<span><b>${esc(nameOf(r.uid))}</b> <span class="num">${signed(r.pts)}</span></span>`).join(`<span class="muted"> · </span>`)
    : `<span class="muted">No graded games yet.</span>`;
  return `
  <div class="topbar">${stripes(84)}${menuBtn()}</div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <span class="kicker">Blazers · 2026–27 season</span>
    <h1>Rip City<br>Over/Under</h1>
    <p class="muted" style="margin:0">Hi ${esc(S.me?.name)}. Pick the winner and ten stat lines for each game. Right is +1, wrong is −1, landing exactly on the line is 0.</p>
  </div>
  ${banner()}${cm() ? answerAlert() : ""}${feat}
  <a class="card" href="#results" style="display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none">
    <div style="min-width:0"><div class="kicker">Season leaderboard</div><div style="margin-top:4px;display:flex;flex-wrap:wrap;gap:4px">${lead}</div></div>
    <span aria-hidden="true" style="font-size:20px">→</span>
  </a>
  ${upcoming.length ? `<div style="display:flex;flex-direction:column;gap:8px"><span class="kicker">Coming up</span><div class="list">${upcoming.map(listRow).join("")}</div></div>` : ""}
  ${recent.length ? `<div style="display:flex;flex-direction:column;gap:8px"><span class="kicker">Recent</span><div class="list">${recent.map(listRow).join("")}</div></div>` : ""}
  <a class="cta ghost" href="#schedule">Full schedule</a>`;
}

function scheduleView(){ return shell(`<h2>Schedule</h2><div class="list">${S.games.map(listRow).join("")}</div>`, {href:"", label:"Home"}); }

function gameView(id){
  const g = gameById(id);
  if (!g) return shell(`<div class="card">That game isn't on the schedule.</div>`, {href:"", label:"Home"});
  const qs = g.questions || [], fin = g.final, lk = locked(g);
  const mine = S.picks[uid()]?.[id] || {};
  const players = S.players.map(p => p.id).filter(p => S.picks[p]?.[id]);
  const others = lk ? players.filter(p => p !== uid()) : (S.pickedBy[id] || []);
  const total = qs.length + 1, done = (mine.winner ? 1 : 0) + qs.filter(q => mine.q?.[q.id]).length;
  const can = !lk;
  if (qs.length && !lk && S.view === "cards") return cardsView(g);
  if (!qs.length) return shell(`${boardHTML(g)}<div class="card"><p style="margin:0">Lines for this game go up automatically the day before.</p>${cm() ? `<p class="note">Or post them yourself.</p><a class="cta" href="#setup-${id}">Post the lines</a>` : ""}</div>`, {href:"", label:"Home"});

  const chips = (getPick, m) => lk && players.length ? `<div class="others">${players.map(p => {
      const pk = getPick(p); if (!pk) return `<span class="pickchip">${esc(nameOf(p))}: —</span>`;
      const mk = m(pk); const c = mk === 1 ? " good" : mk === -1 ? " badp" : mk === 0 ? " push" : "";
      return `<span class="pickchip${c}">${esc(nameOf(p))}: ${esc(pickLabel(pk))}${mk != null ? ` <span class="num">${signed(mk)}</span>` : ""}</span>`;
    }).join("")}</div>` : "";

  const winCard = `<div class="card q">
    <div class="qhead"><div class="who"><b>Who wins?</b><small>Straight up, no spread</small></div></div>
    <div class="seg win">${[["POR", "Trail Blazers"], [g.opp, g.oppName]].map(([a, n]) =>
      `<button data-win="${esc(a)}" aria-pressed="${mine.winner === a}" ${can ? "" : "disabled"}><span class="abbr2">${esc(a)}</span><small>${esc(n)}</small></button>`).join("")}</div>
    ${fin?.winner ? `<div class="final"><span>Winner: <b>${esc(fin.winner)}</b>${fin.porScore != null ? ` <span class="num muted">${fin.porScore}–${fin.oppScore}</span>` : ""}</span>${mine.winner ? `<span class="pts ${cls(markW(mine.winner, fin))}">${signed(markW(mine.winner, fin))}</span>` : ""}</div>` : ""}
    ${chips(p => S.picks[p][id].winner, pk => markW(pk, fin))}
  </div>`;

  const qCard = q => {
    const pk = mine.q?.[q.id], v = fin?.values?.[q.id], m = markQ(pk, q, fin), voided = fin?.voided?.includes(q.id), k = qKind(q);
    const [a, b] = isYN(q) ? [["yes", "Yes", "✓"], ["no", "No", "✕"]] : [["over", "Over", "▲"], ["under", "Under", "▼"]];
    return `<div class="card q${k !== "stat" ? " special" : ""}">
      <div class="qhead">
        <div class="who"><b>${esc(qTitle(q))}</b><small>${k === "stat" ? `${esc(q.team)} · ${esc(STATS[q.stat] || q.stat)}` : isYN(q) ? "Commissioner's special · yes or no" : "Commissioner's special"}</small></div>
        ${isYN(q) ? "" : `<div class="lineval"><span class="num">${fmtLine(q.line)}</span><small>${k === "stat" ? esc(q.stat) : "line"}</small></div>`}
      </div>
      <div class="seg">${[a, b].map(([val, label, icon]) =>
        `<button data-q="${esc(q.id)}" data-v="${val}" aria-pressed="${pk === val}" ${can ? "" : "disabled"}><span class="tri" aria-hidden="true">${icon}</span>${label}</button>`).join("")}</div>
      ${typeof v === "number" ? `<div class="final"><span>${isYN(q) ? "Result" : "Final"}: <b class="num">${esc(finalText(q, v))}</b> ${k === "stat" ? esc(q.stat) : ""}</span>${m !== null ? `<span class="pts ${cls(m)}">${signed(m)}</span>` : ""}</div>`
        : voided ? `<div class="final"><span class="muted">Didn't play. No points either way.</span></div>`
        : fin && k !== "stat" ? `<div class="final"><span class="muted">Waiting on the commissioner to grade this one.</span></div>` : ""}
      ${chips(p => S.picks[p][id].q?.[q.id], pk2 => markQ(pk2, q, fin))}
    </div>`;
  };

  const myScore = fin ? scoreGame(uid(), id) : null;
  const head = lk
    ? `<div class="note">${fin ? (myScore ? `Your game: <b class="num">${signed(myScore.pts)}</b> (${myScore.w}–${myScore.l}${myScore.p ? `–${myScore.p}` : ""})` : "Final.") : "Picks locked at tip-off. Results go up automatically after the game."}${cm() ? ` <a href="#grade-${id}">${needsAnswers(g).length ? "Enter the answer key" : fin ? "Fix final stats" : "Enter final stats"}</a>` : ""}</div>`
    : `<div class="progress"><span class="num">${done}/${total}</span><div class="bar"><i style="width:${done / total * 100}%"></i></div><span class="muted">${others.length ? `${esc(others.map(nameOf).join(", "))} ${others.length > 1 ? "have" : "has"} picked` : "Locks at tip-off"}</span></div>`;

  const por = qs.filter(q => qKind(q) === "stat" && q.team === "POR"), opp = qs.filter(q => qKind(q) === "stat" && q.team !== "POR"), fun = qs.filter(q => qKind(q) !== "stat");
  return shell(`${boardHTML(g)}${banner()}${!lk ? viewToggle() : ""}${head}${winCard}
    ${por.length ? `<span class="kicker">Blazers</span>${por.map(qCard).join("")}` : ""}
    ${opp.length ? `<span class="kicker">${esc(g.oppName)}</span>${opp.map(qCard).join("")}` : ""}
    ${fun.length ? `<span class="kicker">Commissioner's specials</span>${fun.map(qCard).join("")}` : ""}
    ${!lk ? `<p class="note">Picks save as you tap. Tap a pick again to clear it. Everyone's picks show here after tip-off.${cm() ? ` <a href="#setup-${id}">Edit lines</a>` : ""}</p>` : ""}
    ${lk && !fin ? `<a class="cta ghost" href="#results">See the leaderboard</a>` : ""}`, {href:"", label:"Home"});
}

function resultsView(){
  const st = standings();
  const ranked = st.filter(r => r.games);
  const lb = ranked.length ? ranked.map((r, i) => `<div class="lbrow${i === 0 ? " first" : ""}">
      <span class="rank">${i + 1}</span>
      <div class="nm">${esc(nameOf(r.uid))}${r.uid === uid() ? `<span class="you">You</span>` : ""}<small>${r.w}–${r.l}${r.p ? `–${r.p}` : ""} · ${r.games} game${r.games === 1 ? "" : "s"} graded</small></div>
      <span class="total">${signed(r.pts)}</span></div>`).join("")
    : `<div class="card">The leaderboard fills in after the first game is graded.</div>`;
  const played = S.games.filter(g => g.questions?.length && locked(g)).reverse();
  const users = st.map(r => r.uid).filter(p => played.some(g => S.picks[p]?.[g.id]));
  const gameBlock = (g, i) => {
    const fin = g.final, qs = g.questions;
    const cell = (pk, m) => pk ? `<td class="c"><span class="mk ${m == null ? "" : cls(m)}">${esc(pickShort(pk))}${m != null ? ` ${signed(m)}` : ""}</span></td>` : `<td class="c muted">—</td>`;
    const rows = [`<tr><td>Winner</td><td class="num">${fin?.winner ? esc(fin.winner) : "—"}</td>${users.map(p => { const pk = S.picks[p]?.[g.id]?.winner; return cell(pk, markW(pk, fin)); }).join("")}</tr>`]

function cardsView(g){
  const items = deckItems(g);
  if (!S.deck || S.deck.gid !== g.id) {
    const first = items.findIndex(it => !itemPick(g, it));
    S.deck = {gid: g.id, i: first < 0 ? items.length : first, enter: false};
  }
  const i = Math.min(S.deck.i, items.length);

  const others = S.pickedBy[g.id] || [];
  const head = `<div class="deckhead"><div class="mini"><span>${g.home ? `${esc(g.opp)} <span class="muted">at</span> POR` : `POR <span class="muted">at</span> ${esc(g.opp)}`}</span><span class="tip">${isToday(g) ? "Tonight" : esc(fmtDay(g.tip))} · ${esc(fmtTime(g.tip))}</span></div>${viewToggle()}</div>`;

  if (i >= items.length) {
    const rows = items.map(it => {
      const pk = itemPick(g, it);
      const label = it.kind === "winner" ? "Who wins?" : `${esc(qTitle(it.q))} <span class="muted">${esc(qLineText(it.q))}</span>`;
      return `<div><span>${label}</span><b>${pk ? esc(pickLabel(pk)) : "—"}</b></div>`;

        <p class="note" style="margin:0">You can change picks until tip-off. ${others.length ? `${esc(others.map(nameOf).join(", "))} ${others.length > 1 ? "have" : "has"} picked too.` : ""}</p>
        <div class="recap">${rows}</div>
      </div>
      <div class="deckbtns"><button type="button" data-deck="restart">Go through again</button><a class="cta" href="#">Done</a></div>`, {href:"", label:"Home"});
  }
  const it = items[i], next = items[i + 1];
  const yn = it.kind === "q" && isYN(it.q);
  const yes = it.kind === "winner" ? "Blazers" : yn ? "Yes" : "Over", no = it.kind === "winner" ? esc(g.opp) : yn ? "No" : "Under";

    <div class="deck" id="deck">${next ? cardHTML(g, next, false) : ""}${cardHTML(g, it, true, enter)}</div>
    <div class="deckbtns"><button type="button" data-fly="-1"><span aria-hidden="true">←</span> ${no}</button><button type="button" class="yes" data-fly="1">${yes} <span aria-hidden="true">→</span></button></div>
    <div class="decknav"><button type="button" data-deck="back" ${i === 0 ? "disabled" : ""}>← Previous</button>${dots}<button type="button" data-deck="skip">Skip →</button></div>`, {href:"", label:"Home"});
}

function deckCommit(dir){
  const g = gameById(S.deck?.gid); if (!g) return;
  const it = deckItems(g)[S.deck.i]; if (!it) return;
  const val = it.kind === "winner" ? (dir > 0 ? "POR" : g.opp) : isYN(it.q) ? (dir > 0 ? "yes" : "no") : (dir > 0 ? "over" : "under");
  S.deck.i++;
  deck.busy = false;
  setPick(g.id, it.kind, it.id, val, false); // re-renders
}

// Throw the top card off one side, then record the pick.
function fly(dir){
  const el = app.querySelector(".swipe.top");
  if (!el || deck.busy) return;
  if (locked(gameById(S.deck.gid))) { render(); return; }
  deck.busy = true;
  if (navigator.vibrate) try { navigator.vibrate(8); } catch {}
  if (reduceMotion()) return deckCommit(dir);
  el.querySelector(dir > 0 ? ".stamp.yes" : ".stamp.no").style.opacity = 1;
  el.style.transition = "transform .32s cubic-bezier(.3,.5,.4,1)";
  const w = Math.max(innerWidth, 500);
  el.style.transform = `translateX(${dir * w * 1.15}px) translateY(-20px) rotate(${dir * 22}deg)`;
  app.querySelector(".swipe.under-card")?.classList.add("rise");
  setTimeout(() => deckCommit(dir), 300);
}

function bindDeck(){
  const el = app.querySelector(".swipe.top");
  if (!el) return;
  const yes = el.querySelector(".stamp.yes"), no = el.querySelector(".stamp.no"), under = app.querySelector(".swipe.under-card");
  let sx = 0, sy = 0, dx = 0, axis = null, down = false, t0 = 0;
  const reset = () => {
    el.style.transition = "transform .28s cubic-bezier(.2,.8,.3,1.2)"; el.style.transform = "";
    yes.style.opacity = 0; no.style.opacity = 0;
    if (under) { under.style.transition = ""; under.style.transform = ""; under.style.opacity = ""; }
  };
  el.addEventListener("pointerdown", e => {
    if (deck.busy || (e.pointerType === "mouse" && e.button !== 0)) return;
    down = true; axis = null; dx = 0; sx = e.clientX; sy = e.clientY; t0 = performance.now();
    el.style.transition = "none";
    deck.busy = true; // no background re-render mid-drag
  });
  el.addEventListener("pointermove", e => {
    if (!down) return;
    const mx = e.clientX - sx, my = e.clientY - sy;
    if (!axis && (Math.abs(mx) > 8 || Math.abs(my) > 8)) {
      axis = Math.abs(mx) > Math.abs(my) ? "x" : "y";
      if (axis === "x") el.setPointerCapture?.(e.pointerId);
    }
    if (axis !== "x") return;
    dx = mx;
    el.style.transform = `translateX(${dx}px) translateY(${Math.abs(dx) * -0.04}px) rotate(${dx / 16}deg)`;
    const k = Math.min(1, Math.abs(dx) / 90);
    yes.style.opacity = dx > 0 ? k : 0; no.style.opacity = dx < 0 ? k : 0;
    if (under) { under.style.transition = "none"; const s = 0.94 + 0.06 * k; under.style.transform = `scale(${s}) translateY(${14 * (1 - k)}px)`; under.style.opacity = 0.7 + 0.3 * k; }
  });
  const end = () => {
    if (!down) return;
    down = false;
    const v = Math.abs(dx) / Math.max(1, performance.now() - t0); // px per ms
    if (axis === "x" && (Math.abs(dx) > 90 || (Math.abs(dx) > 40 && v > 0.5))) { deck.busy = false; fly(dx > 0 ? 1 : -1); }
    else { deck.busy = false; reset(); }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", () => { if (down) { down = false; deck.busy = false; reset(); } });
}

addEventListener("keydown", e => {
  if (!app.querySelector(".swipe.top") || e.target.closest?.("input,select,textarea")) return;
  if (e.key === "ArrowRight") { e.preventDefault(); fly(1); }
  if (e.key === "ArrowLeft") { e.preventDefault(); fly(-1); }
});

function commishView(){
  if (!S.me?.admin) return shell(`<div style="display:flex;flex-direction:column;gap:6px"><span class="kicker">Commissioner</span><h2>Commissioner mode</h2></div>

  if (!S.commish) setCommish(true);
  const now = Date.now();
  const next = S.games.filter(g => Date.parse(g.tip) + 3.5 * 3600e3 > now).slice(0, 3);
  const past = S.games.filter(g => Date.parse(g.tip) + 3.5 * 3600e3 <= now && g.questions?.length).slice(-5).reverse();
  const row = g => {
    const n = needsAnswers(g).length, has = !!g.questions?.length;
    const status = n ? `${n} special${n === 1 ? "" : "s"} to answer` : isFinal(g) ? "Graded" : locked(g) ? (has ? "Waiting on ESPN" : "No lines were posted") : has ? `${g.questions.length} lines posted` : "No lines yet";
    const act = locked(g) ? (has ? [`grade-${g.id}`, n ? "Answer key" : isFinal(g) ? "Fix stats" : "Enter stats", n > 0] : null) : [`setup-${g.id}`, has ? "Edit lines" : "Post lines", !has];
    const inner = `<div class="opp"><b>${g.home ? "vs" : "at"} ${esc(g.oppName)}</b><small>${esc(fmtDay(g.tip))} · ${status}</small></div>`;
    return act ? `<a class="trow" href="#${act[0]}">${inner}<span class="pill${act[2] ? " hot" : ""}">${act[1]}</span></a>` : `<div class="trow">${inner}</div>`;
  };
  return shell(`<div style="display:flex;flex-direction:column;gap:6px"><span class="kicker">Signed in as ${esc(S.me?.name)}</span><h2>Commissioner tools</h2></div>
    ${answerAlert()}
    ${next.length ? `<span class="kicker">Coming up</span><div class="list">${next.map(row).join("")}</div>` : ""}
    ${past.length ? `<span class="kicker">Recent</span><div class="list">${past.map(row).join("")}</div>` : ""}
    <span class="kicker">ESPN</span>
    <div class="card tools">
      <p class="note" style="margin:0">Checks on its own every 15 minutes: updates the schedule, posts lines a day ahead, and grades finished games.</p>
      <button class="cta ghost" id="syncBtn" type="button">Check ESPN now</button>
      ${S.syncLog ? `<pre class="log">${esc(S.syncLog)}</pre>` : ""}
    </div>
    <span class="kicker">Players</span>
    <div class="card note" style="margin:0">${S.players.map(p => esc(p.name)).join(", ") || "Nobody yet."}<br>Share the site and the family passcode to add someone.</div>
    <button class="cta" type="button" data-cm="off">Back to playing</button>`, {href:"", label:"Home"});
}

/* ---------- menu ---------- */
const menuEl = document.getElementById("menu");
function menuBtn(){ return `<button class="menubtn" type="button" data-menu aria-label="Menu" aria-haspopup="dialog" aria-expanded="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>`; }
// Every screen lives here; add new ones to this list.
function menuItems(){
  const n = S.games.filter(g => needsAnswers(g).length && Date.now() > Date.parse(g.tip) + 2 * 3600e3).length;
  return [
    ["", "Home"],
    ["results", "Results & leaderboard"],
    ["schedule", "Full schedule"],
    S.me?.admin ? ["commish", cm() ? "Commissioner tools" : "Commissioner mode", n ? `${n} to grade` : ""] : ["commish", "Commissioner", "Passcode"],
  ];
}
function openMenu(){
  const r = route();
  menuEl.innerHTML = `<nav role="dialog" aria-modal="true" aria-label="Menu"><div class="mhead"><span>Signed in as ${esc(S.me?.name)}</span><button type="button" data-close aria-label="Close menu">×</button></div>
    ${menuItems().map(([h, label, sub]) => `<a href="#${h}"${r === h ? ` aria-current="page"` : ""}>${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ""}</a>`).join("")}
    <div class="sep"></div>
    ${cm() ? `<button type="button" class="mi quiet" data-cm="off">Exit commissioner mode</button>` : ""}
    <button type="button" class="mi quiet" data-signout>Sign out</button></nav>`;
  menuEl.hidden = false;
  requestAnimationFrame(() => menuEl.classList.add("on"));
  app.querySelector("[data-menu]")?.setAttribute("aria-expanded", "true");
  menuEl.querySelector(`a[aria-current]`)?.focus() || menuEl.querySelector("a")?.focus();
}
function closeMenu(){
  if (menuEl.hidden) return;
  menuEl.classList.remove("on"); menuEl.hidden = true; menuEl.innerHTML = "";
  app.querySelector("[data-menu]")?.setAttribute("aria-expanded", "false");
}
menuEl.addEventListener("click", e => {
  if (e.target === menuEl || e.target.closest("[data-close]")) return closeMenu();
  if (e.target.closest("[data-signout]")) { closeMenu(); return signOut(); }
  if (e.target.closest("[data-cm=off]")) { closeMenu(); setCommish(false); if (route() === "commish" || /^(setup|grade)-/.test(route())) location.hash = ""; else render(); toast("Back to playing"); return; }
  const a = e.target.closest("a");
  if (a) { closeMenu(); if (a.getAttribute("href") === "#" + route()) { e.preventDefault(); window.scrollTo(0, 0); } }
});
addEventListener("keydown", e => { if (e.key === "Escape" && !menuEl.hidden) { closeMenu(); app.querySelector("[data-menu]")?.focus(); } });

/* ---------- router ---------- */
const route = () => location.hash.replace(/^#/, "");
function render(){
  const r = route();
  let html;
  if (!S.token) html = loginView();
  else if (!S.loaded) html = `<div class="topbar">${stripes(84)}</div><h1>Rip City<br>Over/Under</h1><p class="muted">${S.offline ? "Can't reach the server. Check your connection." : "Loading…"}</p>`;
  else if (r.startsWith("game-")) html = gameView(r.slice(5));
  else if (r.startsWith("setup-")) html = setupView(r.slice(6));
  else if (r.startsWith("grade-")) html = gradeView(r.slice(6));
  else if (r === "results") html = resultsView();
  else if (r === "schedule") html = scheduleView();
  else if (r === "commish") html = commishView();
  else html = homeView();
  const keepScroll = render.last === r;
  if (S.token && S.loaded) html = cmBar() + html;
  app.innerHTML = html;
  if (!keepScroll) window.scrollTo(0, 0);
  render.last = r;
  bindDeck();
}
// Background refreshes leave half-filled forms alone.
function refresh(){ if (deck.busy) return; if (app.querySelector("form") && (!S.token || /^(setup|grade|commish)/.test(route()))) return; render(); }
addEventListener("hashchange", () => { closeMenu(); render(); });

function signOut(){ setCommish(false); S.token = null; S.me = null; S.loaded = false; store.set(null); render(); }

app.addEventListener("click", async e => {
  if (e.target.closest("[data-menu]")) return openMenu();
  const id = route().slice(5);
  const w = e.target.closest("[data-win]"); if (w) return setPick(id, "winner", null, w.dataset.win);
  const q = e.target.closest("[data-q]"); if (q) return setPick(id, "q", q.dataset.q, q.dataset.v);
  if (e.target.closest("#signOut")) return signOut();
  const vt = e.target.closest("[data-view]");
  if (vt) { S.view = vt.dataset.view; try { localStorage.setItem(VIEW_KEY, S.view); } catch {} S.deck = null; render(); return; }
  const fl = e.target.closest("[data-fly]"); if (fl) return fly(+fl.dataset.fly);
  const dk = e.target.closest("[data-deck]");
  if (dk && S.deck && !deck.busy) {
    const n = deckItems(gameById(S.deck.gid)).length;
    if (dk.dataset.deck === "back" && S.deck.i > 0) { S.deck.i--; S.deck.enter = true; }
    if (dk.dataset.deck === "skip") S.deck.i = Math.min(n, S.deck.i + 1);
    if (dk.dataset.deck === "restart") S.deck.i = 0;
    render(); return;
  }
  if (e.target.closest("[data-cm=off]")) { setCommish(false); if (route() === "commish" || /^(setup|grade)-/.test(route())) location.hash = ""; else render(); toast("Back to playing"); return; }
  const sb = e.target.closest("#syncBtn");
  if (sb) {
    sb.disabled = true; sb.textContent = "Checking ESPN…";
    try { const r = await api("/api/admin/sync", {method: "POST"}); S.syncLog = r.log.join("\n"); toast("Up to date"); }
    catch (err) { S.syncLog = err.message; toast(err.message); }
    await load(); render();
    return;
  }
  const add = e.target.closest("[data-add]");
  if (add) {
    readSetup();
    const id = "q" + Date.now().toString(36), k = add.dataset.add;
    S.setup.rows.push(k === "stat" ? {id, team: add.dataset.team || "POR", player: "", stat: "PTS", line: ""} : k === "custom" ? {id, kind: "custom", text: "", line: ""} : {id, kind: "yn", text: ""});
    S.setup.open = S.setup.rows.length - 1;
    render();
    app.querySelector(`#${k === "stat" ? "p" : "x"}${S.setup.open}`)?.focus();
    return;
  }
  const op = e.target.closest("#setupForm [data-open]");
  if (op) {
    readSetup(); const i = +op.dataset.open;
    S.setup.open = S.setup.open === i ? null : i; render();
    const q = S.setup.rows[i];
    if (S.setup.open === i && !(q.player || q.text)) app.querySelector(`#${qKind(q) === "stat" ? "p" : "x"}${i}`)?.focus();
    return;
  }
  const st = e.target.closest("#setupForm [data-step]");
  if (st) {
    readSetup(); const q = S.setup.rows[+st.dataset.i], n = Number(q.line);
    q.line = String(Math.max(0, (q.line !== "" && Number.isFinite(n) ? n : 0) + +st.dataset.step)); render(); return;
  }
  const set = e.target.closest("#setupForm [data-set]");
  if (set) { readSetup(); S.setup.rows[+set.dataset.i][set.dataset.set] = set.dataset.v; render(); return; }
  const al = e.target.closest("#autoLines");
  if (al) {
    readSetup(); al.disabled = true; al.textContent = "Getting season averages…";
    try { const r = await api("/api/admin/autolines/" + S.setup.id, {method: "POST"}); S.setup.rows = r.questions.concat(S.setup.rows.filter(q => qKind(q) !== "stat")); toast("Added " + r.questions.length + " lines. Save to post them."); }
    catch (err) { toast(err.message); }
    render(); return;
  }
  const del = e.target.closest("[data-del]"); if (del) { readSetup(); S.setup.rows.splice(+del.dataset.del, 1); S.setup.open = null; render(); }
});
function readSetup(){
  app.querySelectorAll("#setupForm [data-f]").forEach(el => { const row = S.setup.rows[+el.dataset.i]; if (row) row[el.dataset.f] = el.value; });
}
// Keep a question's summary in step with what's being typed.
app.addEventListener("input", e => {
  const f = e.target.closest?.("#setupForm [data-f=player], #setupForm [data-f=text]");
  const b = f?.closest(".qrow")?.querySelector(".qname b");
  if (b) b.textContent = f.value.trim() || (f.dataset.f === "player" ? "Choose a player" : "Write the question");
});

app.addEventListener("submit", async e => {
  e.preventDefault();
  if (e.target.id === "loginForm") {
    const name = app.querySelector("#ln").value, passcode = app.querySelector("#lp").value;
    try {
      const r = await api("/api/login", {method: "POST", body: JSON.stringify({name, passcode})});
      S.token = r.token; S.me = r.me; S.loginErr = ""; store.set(r.token); await load();
    } catch (err) { S.loginErr = err.message; app.querySelector("#lerr").textContent = err.message; }
  }
  if (e.target.id === "unlockForm") {
    try { const r = await api("/api/unlock", {method: "POST", body: JSON.stringify({passcode: app.querySelector("#cp").value})}); S.me = r.me; setCommish(true); toast("Commissioner mode on"); await load(); render(); }
    catch (err) { app.querySelector("#cerr").textContent = err.message; }
  }
  if (e.target.id === "setupForm") {
    readSetup();
    const gid = S.setup.id, opp = gameById(gid)?.opp;
    const rank = q => qKind(q) !== "stat" ? 2 : q.team === opp ? 1 : 0;
    const questions = S.setup.rows.map((q, i) => [q, i]).sort((x, y) => rank(x[0]) - rank(y[0]) || x[1] - y[1]).map(([q]) => q);
    try {
      const r = await api("/api/admin/lines/" + gid, {method: "PUT", body: JSON.stringify({questions})});
      S.setup = null; toast(r.cleared ? `Lines saved. Cleared ${r.cleared} pick${r.cleared === 1 ? "" : "s"} on changed questions.` : "Lines saved");
      location.hash = "game-" + gid; load();
    }
    catch (err) { toast(err.message); }
  }
  if (e.target.id === "gradeForm") {
    const gid = route().slice(6);
    const values = {}; app.querySelectorAll("[data-qv]").forEach(el => { if (el.value.trim() !== "") values[el.dataset.qv] = el.value; });
    const final = {winner: app.querySelector("#gw").value || null, porScore: app.querySelector("#gps").value, oppScore: app.querySelector("#gos").value, values};
    try { await api("/api/admin/final/" + gid, {method: "PUT", body: JSON.stringify({final})}); toast("Saved. Points are updated."); location.hash = "game-" + gid; load(); }
    catch (err) { toast(err.message); }
  }
});

S.token = store.get();
render();
if (S.token) load();
setInterval(() => { if (S.token && !document.hidden) load(); }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.token) load(); });
</script>
</body>
</html>
