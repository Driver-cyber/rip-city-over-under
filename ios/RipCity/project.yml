name: RipCity
options:
  bundleIdPrefix: com.chadstewartcpa
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: Y3D7LWWL56
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RipCity:
    type: application
    platform: iOS
    sources: [RipCity]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chadstewartcpa.ripcity
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Rip City
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  RipCityTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RipCityTests]
    dependencies:
      - target: RipCity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chadstewartcpa.ripcityTests
        GENERATE_INFOPLIST_FILE: YES
  RipCityUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [RipCityUITests]
    dependencies:
      - target: RipCity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chadstewartcpa.ripcityUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: RipCity
schemes:
  RipCity:
    build:
      targets:
        RipCity: all
        RipCityTests: [test]
        RipCityUITests: [test]
    test:
      targets: [RipCityTests, RipCityUITests]
